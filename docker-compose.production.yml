name: love

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: love
      POSTGRES_USER: love
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在服务器秘密文件中设置 POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U love -d love"]
      interval: 5s
      timeout: 4s
      retries: 20

  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: love
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在服务器秘密文件中设置 MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data

  storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      storage:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://storage:9000 love "$${MINIO_ROOT_PASSWORD}"; do
          sleep 2;
        done &&
        mc mb --ignore-existing local/love
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在服务器秘密文件中设置 MINIO_ROOT_PASSWORD}
    restart: "no"

  migrate:
    build:
      context: .
    image: love:${LOVE_IMAGE_TAG:-local}
    command: ["node", "scripts/migrate.mjs"]
    environment: &app-environment
      NEXT_PUBLIC_SITE_URL: https://love.atimefriend.cn
      DATABASE_URL: postgresql://love:${POSTGRES_PASSWORD}@database:5432/love
      SESSION_SECRET: ${SESSION_SECRET:?请在服务器秘密文件中设置 SESSION_SECRET}
      S3_ENDPOINT: http://storage:9000
      S3_REGION: us-east-1
      S3_BUCKET: love
      S3_ACCESS_KEY_ID: love
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      database:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    restart: "no"

  app:
    image: love:${LOVE_IMAGE_TAG:-local}
    restart: unless-stopped
    environment: *app-environment
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
  minio-data:
